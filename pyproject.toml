# Vercel installs from this table (with uv) whenever pyproject.toml exists, and ignores
# requirements.txt. Keep the two lists identical; tests/test_packaging.py checks it.
[project]
name = 'proof-ledger'
version = '0.1.0'
requires-python = '>=3.12'
dependencies = [
    'Django>=5.1,<5.3',
    'djangorestframework>=3.15',
    'django-unfold>=0.40',
    'httpx>=0.27',
    'psycopg[binary]>=3.2',
    'dj-database-url>=2.2',
    'gunicorn>=23',
    'whitenoise>=6.7',
]

[tool.ruff]
line-length = 100
target-version = 'py312'
extend-exclude = ['*/migrations/*']

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'DJ']

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'config.settings'
python_files = ['test_*.py']

# Vercel's Django preset finds WSGI_APPLICATION on its own; this pins it explicitly.
[tool.vercel]
entrypoint = 'config.wsgi:application'
