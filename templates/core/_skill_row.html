<li id="skill-{{ s.pk }}" class="row">
  <span class="name">{{ s.name }}</span>
  <span class="bar" role="img" aria-label="Freshness {{ s.pct }} percent"><i class="{{ s.tier }}" style="width: {{ s.pct }}%"></i></span>
  <span class="meta">{{ s.pct }}%</span>
  <span class="tag {{ s.tier }}">{{ s.tier|capfirst }}</span>
  <span class="meta">{% if s.proof_count %}{{ s.proof_count }} proof{{ s.proof_count|pluralize }}{% else %}<b class="stale">no proof</b>{% endif %}</span>
  <span>{% if user.is_staff %}<button hx-post="{% url 'revise' s.pk %}" hx-target="#skill-{{ s.pk }}" hx-swap="outerHTML" aria-label="Mark {{ s.name }} revised">Mark revised</button>{% endif %}</span>
</li>
