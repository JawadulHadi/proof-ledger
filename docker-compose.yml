services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: proofledger
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10
  web:
    build: .
    ports:
      - '8000:8000'
    environment:
      POSTGRES_DB: proofledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
